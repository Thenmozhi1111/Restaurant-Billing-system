body {

}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #1a1a1a;
  padding: 15px 50px;
  position: absolute;
  width: 100%;
  z-index: 10;
}

.navi{
        top:40px;
        margin-left: 900px;
        position: absolute;
    }
    .navi a{
    font-size: 1.1em;
    color: white;
    text-decoration: none;
    margin-right: 40px;
    font-weight: 500;
    transition: 2s;
}
.navi a:hover{
    color: rgb(8, 159, 51);
    cursor: pointer;
}
#hi{
    position: absolute;

    left: 550px;

.hero {
  height: 100vh;
  background-color: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.overlay {
  background-color: rgba(0, 0, 0, 0.6);
  padding: 50px;
  text-align: center;
  max-width: 800px;
  width: 100%;
}

.overlay h2 {
  font-size: 24px;
  font-weight: 400;
  margin-bottom: 10px;
}

.overlay h1 {
  font-size: 48px;
  color: #ff3c00;
  font-weight: 800;
  margin-bottom: 40px;
}

.contact-info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 30px;
}

.info-box {
  text-align: center;
}

.info-box span {
  font-size: 30px;
  display: block;
  margin-bottom: 10px;
}
  </style>
