<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Building System</title>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;

}
#aaa{
width: 100vw;
height: 100vh;
position: absolute;
top: 5px;
left: 5px;
}
img{
    width: 100vw;
    height: 100vh;
    position: relative;
    filter: blur(7px);
}
.navi{
    top:5px;
    margin-left: 900px;
    position: absolute;

}
.navi a{
    font-size: 1.1em;
    color: white;
    text-decoration: none;
    margin-right: 40px;
    font-weight: 500;
    transition: 2s;
}
.navi a:hover{
    color: rgb(8, 159, 51);
    cursor: pointer;
}
        #sub11{
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 80px;
            left: 5px;
            color:blanchedalmond;
            font-size:50px;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: center;
          
        }
        #sub12{
            position:absolute;
            font-family: 'Times New Roman', Times, serif;
            margin-left: 170px;
            top: 350px;
            left: 220px;
            font-size: 100px;
            color:cornsilk;
        }
        #sub12 span{
            margin-right: 40px;
        }
        #sub13{
            position: absolute;
            top: 450px;
            left: 650px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
     

    .b1 { padding: 15px 30px; margin: 10px; font-size: 20px; background-color:bisque; color: black; border: black;  cursor: pointer; }
    .b1:hover { background-color: rgb(27, 25, 26);  color: white ; }

    </style>


</head>
<body>
    <div id="aaa">
        <img src="{{ url_for('static', filename='food.webp') }}">

       <header class="navi">
            <a href="{{ url_for('home') }}">HOME</a>
            <a href="{{ url_for('about') }}">ABOUT</a>
            <a href="{{ url_for('menus') }}">MENU</a>
            <a href="{{ url_for('menu') }}">ORDER</a>
            <a href="{{ url_for('contact') }}">CONTACT</a>
        </header>

    <section>
        <div id="sub11">
            <br><br>
            <h1>WELCOME TO OUR RESTAURANT</h1>
        </div>
        <div id="sub12">
            <span >EAT  </span>
            <span >DRINK </span>
            <span >VISIT  </span>
        </div>
        <div id="sub13">
            <form action="/menu" method="GET">
                <button class="b1" type="submit">Order now</button>
            </form>
            
        </div>
    </section>   
    </div>
   
</div>
</body>
</html>
